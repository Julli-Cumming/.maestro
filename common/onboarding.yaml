appId: com.brapp.work
---
- tapOn: "Vamos come\u00e7ar?"
- tapOn:
    id: "input-cpf-signin-text-input"
- inputText: "74873540089"
- tapOn: "Continuar"
- tapOn:
    id: "signin-password-text-input"
- inputText: "123456"
- tapOn: "Continuar"
- tapOn: "E-mail"
- tapOn:
    id: "code-confirmation-email-text-input"
- assertVisible: "C\u00f3digo de confirma\u00e7\u00e3o enviado para\nj*****a@sofist.co"
- runScript:
    file: ../E2E/Integracao.vscode/pegar-token.js
    env:
      LOGIN_ID: "74873540089"
- tapOn:
    id: "code-confirmation-email-text-input"
- inputText: ${output.sfToken}
- tapOn: "Continuar"
- waitForAnimationToEnd
