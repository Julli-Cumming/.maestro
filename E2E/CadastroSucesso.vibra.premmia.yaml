appId: com.brapp.work
---
- launchApp:
    clearState: true
- tapOn: "Vamos come\u00e7ar?"
# Inserir CPF Valido
- tapOn:
    id: "input-cpf-signin-text-input"
- inputText: "83141192022"
- tapOn: "Continuar"
# Inserir nome, sobrenome e data de nascimento valido
- tapOn:
    id: "first-name-signup-text-input"
- inputText: "Test Automation"
- tapOn:
    id: "last-name-signup-text-input"
- inputText: "Maestro"
- tapOn:
    id: "birthday-signup-text-input"
- inputText: "13/07/1976"
- tapOn: "Continuar"
# Inserir email e telefone valido
- tapOn: "exemplo@email.com"
- inputText: "testautomatio"
- tapOn: "@gmail.com"
- tapOn: "(00) 00000-0000"
- inputText: "14998760000"
- tapOn: "Continuar"
# Inserir senha, repetir senha e acordos valido
- tapOn:
    id: "password-signup-text-input"
- inputText: "123456"
- tapOn:
    point: 81%,26%
- tapOn:
    id: "confirm-password-signup-text-input"
- inputText: "123456"
- tapOn:
    point: 81%,37%
- assertVisible: "Ter 6 n\u00fameros"
- assertVisible: "As senhas devem ser iguais"
- tapOn: "Li e concordo com o Termos e condi\u00e7\u00f5es"
- assertVisible: "Termos e condi\u00e7\u00f5es"
#- scrollUntilVisible:
    #element: "12.3."
    #direction: DOWN
    #timeout: 80000   # Define o tempo limite para 1min e 20s segundos
- tapOn:
    point: 9%,8%
#clicar no primero checkbox
- tapOn:
    id: "checkbox"  # CORREÇÃO: O ID correto provavelmente é "checkbox"
    index: 0        # Especifica que é o primeiro da lista
- tapOn: "Estou ciente da Pol\u00edtica de Privacidade da\nVibra e do Aviso Complementar de\n Privacidade do Programa de Fidelidade\nPetrobras Premmia"
- assertVisible: "Pol\u00edtica de Privacidade da\nVibra e do Aviso Complementar de\n Privacidade do Programa de Fidelidade\nPetrobras Premmia"
#- scrollUntilVisible:
    #element: "12.3."
    #direction: DOWN
    #timeout: 80000   # Define o tempo limite para 1min e 20s segundos
- tapOn:
    point: 9%,8%
# 2. Clica no SEGUNDO checkbox (índice 1)
- tapOn:
    id: "checkbox"  # Usa o mesmo ID
    index: 1        # Especifica que é o segundo da lista
- tapOn: "Continuar"
- tapOn: "E-mail"
- assertVisible: "C\u00f3digo de confirma\u00e7\u00e3o enviado para\ntestautomatio@gmail.com"
# 1. Busca o token de e-mail na API usando o script e o CPF do usuário
#- runScript:
   # file: Integracao.vscode/pegar-token.js
    #env:
     # LOGIN_ID: "83141192022"
- tapOn:
    id: "code-confirmation-email-text-input"
- inputText: "111111"
# 2. Insere o token recebido dinamicamente da API
#- inputText: ${output.sfToken}
#- assertVisible: "C\u00f3digo expira em 3:55"
- tapOn: "Continuar"

















