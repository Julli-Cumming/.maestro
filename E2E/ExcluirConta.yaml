# ==============================================================================
- assertVisible: "Exclusão da conta"
- assertVisible: "Por que você quer excluir?"
- assertVisible: "Obrigatório"
- scrollUntilVisible:
    element: "E-mail"
- tapOn: "Ligue para 4090-1337"
- tapOn: "Visão geral"
- tapOn:
    id: "snapshot"
- tapOn: "Ligue para 0800-770-1337"
- tapOn: "Visão geral"
- tapOn:
    id: "snapshot"
- tapOn: "WhatsApp"
- tapOn: "Visão geral"
- tapOn:
    id: "snapshot"
- tapOn: "E-mail"
- tapOn: "Visão geral"
- tapOn:
    id: "snapshot"
- scrollUntilVisible:
    element: "Outro motivo"
    direction: UP
    timeout: 30000
    centerElement: true
- tapOn: "Outro motivo"
- tapOn:
    point: 83%,25%
- tapOn:
    point: 13%,30%
- inputText: "Teste de exclusão de conta"
- waitForAnimationToEnd
- tapOn: "Continuar"
- waitForAnimationToEnd
- assertVisible: "Excluir conta permanentemente"
- tapOn: "Excluir conta"
