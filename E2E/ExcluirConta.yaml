
appId: com.brapp.work
---
- launchApp:
    clearState: false
    stopApp: true

# Acessa o perfil pelo avatar no cabeçalho da home
- extendedWaitUntil:
    visible:
      id: "home-header-avatar-test-id"
    timeout: 30000

- tapOn:
    id: "home-header-avatar-test-id"
- waitForAnimationToEnd
- tapOn:
    point: 81%,59%
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Excluir conta"
    direction: DOWN
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Excluir conta"
- waitForAnimationToEnd
- assertVisible: "Sair do App"
- tapOn: "Continuar"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Veja o quanto você aproveitou até hoje"
    timeout: 20000
- assertVisible: "Veja o quanto você aproveitou até hoje"
- swipe:
    start: 50%,80%
    end: 50%,35%
- waitForAnimationToEnd
- tapOn: "Continuar"
- waitForAnimationToEnd
# ==============================================================================
